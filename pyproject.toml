[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chief-of-staff"
version = "0.1.0"
description = "A persistent chief of staff and Claude workstreams, right in your terminal."
requires-python = ">=3.11"
dependencies = ["textual>=1.0,<7"]

[project.scripts]
chief = "chief.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chief"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
line-length = 110
